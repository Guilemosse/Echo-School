<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Echo School - Login</title>
</head>
<body>
  <div class="login-container">
    <img src="Logo-removebg-preview.png" id="echo" alt="Logo Echo School"/>
    
    <form action="/login" method="post" class="login-form">
      <div class="input-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      
      <button type="submit" class="btn-primary">Login</button>
      
      <div class="form-actions">
        <a href="forgot_password.html" class="forgot-link">Forgot Password?</a>
      </div>

      <div class="divider">
        <span>ou</span>
      </div>

      <button type="button" class="btn-gov" onclick="window.location.href='dash.html'">
        Entrar com gov.br
      </button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
